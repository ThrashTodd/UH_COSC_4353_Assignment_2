name: FastAPI Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Temporary PostgreSQL database for automated testing
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: queuesmart_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d queuesmart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variables used by db_connection.py
    env:
      TESTING: "true"
      PGHOST: localhost
      PGPORT: 5432
      TEST_PGDATABASE: queuesmart_test
      TEST_PGUSER: test_user
      TEST_PGPASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/tests/requirements.txt

      - name: Initialize test database
        run: |
          PGPASSWORD=$TEST_PGPASSWORD psql \
            -h $PGHOST \
            -p $PGPORT \
            -U $TEST_PGUSER \
            -d $TEST_PGDATABASE \
            -v ON_ERROR_STOP=1 \
            -f database/queuesmart_schema.sql

      - name: Run tests with pytest
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -v --cov=backend backend/tests
