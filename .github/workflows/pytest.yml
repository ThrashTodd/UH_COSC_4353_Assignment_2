name: FastAPI Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs fastapi, pydantic, pytest, and httpx from your file
        if [ -f backend/tests/requirements.txt ]; then 
          pip install -r backend/tests/requirements.txt;
        else
          echo "Error: backend/tests.requirements.txt not found"
          exit 1
        fi

    - name: Run tests with pytest
      env:
        # Resolves your local files (database, service_logic, etc.) inside backend/
        PYTHONPATH: backend
      run: |
        python -m pytest -v
