<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_Screen</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>

    <header class="banner">
        <h1>QueueSense</h1>
    </header>
    <div class="wrapper">
        <p id="errorMessage"></p>
        <form class="form" id="form">
            <div>
                <label for="username">
                <input type="username" name="usernameInput" id="usernameInput" placeholder="Username">
            </div>
            <div>
                <label for="password">
                <input type="password" name="passwordInput" id="passwordInput" placeholder="Password">
            </div>
            <button type="submit">Log in</button>
        </form>
        <p>Don't have an account? <a href="register.html">Sign up</a> here.</p>
        <p>Temp Link: <a href="user.html">user</a>, <a href="admin.html">admin</a>.</p>
    </div>
</body>
</html>
