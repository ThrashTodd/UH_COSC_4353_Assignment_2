<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>

    <header class="banner">
        <h1>QueueSense</h1>
    </header>
    <div class="wrapper">
        <p id="errorMessage"></p>
        <form class="form" id="form">
            <div>
                <label for="usernameInput">
                <input type="text" name="usernameInput" id="usernameInput" placeholder="Username" >
            </div>
            <div>
                <label for="email">
                <input type="email" name="emailInput" id="emailInput" placeholder="Email" >
            </div>
            <div>
                <label for="password">
                <input type="password" name="passwordInput" id="passwordInput" placeholder="Password" >
            </div>
            <div>
                <label for="confirmPassword">
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password" >
            </div>

            <button type="submit">Register</button>
        </form>
        <p>Already a user? <a href="index.html">Log in</a></p>
        <p>Temp Link: <a href="user.html">user</a>, <a href="admin.html">admin</a>.</p>
    </div>
</body>
</html>
