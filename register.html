<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Smart | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"/>
    <script src="userDatabase.js" defer></script>
    <script src="login.js" defer></script>
</head>
<body class="auth-page">
    <header class="banner">
        <h1>QueueSmart</h1>
    </header>
        <main class="wrapper">
        <section class="auth-card">
        <div class="auth-heading">
            <p class="eyebrow">Patient Registration</p>
            <h2>Create an account</h2>
            <p>New accounts are created with the patient role.</p>
        </div>

        <p id="errorMessage" class="error-message" role="alert"></p>

        <form class="form" id="form" novalidate>
            <div>
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" placeholder="Choose a username" autocomplete="username" />
            </div>

            <div>
                <label for="emailInput">Email</label>
                <input type="email" id="emailInput" placeholder="Enter your email" autocomplete="email" />
            </div>

            <div>
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="At least 8 characters" autocomplete="new-password" />
            </div>

            <div>
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" />
            </div>

            <button class="btn btn-primary full" type="submit">Create account</button>
        </form>

        <p class="form-signup">Already have an account? <a href="index.html">Log in</a>.</p>
        </section>
  </main>

</body>
</html>
